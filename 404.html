    <script>
      const loader = document.getElementById('loader');
      const loaderVideo = document.getElementById('loader-video');
      let finished = false;

      // Lock scrolling while loader is active
      document.body.style.overflow = 'hidden';

      function finishLoading() {
        if (finished) return;
        finished = true;
        document.body.style.overflow = ''; // Restore scrolling
        loader.classList.add('hide');
        setTimeout(() => loader.remove(), 1200); // clean up DOM after fade
      }

      // Reveal site once the loader video finishes playing
      loaderVideo.addEventListener('ended', finishLoading);

      // Safety net: if video fails to load or play (slow connection, autoplay block),
      // don't trap the user on the loader forever.
      loaderVideo.addEventListener('error', finishLoading);
      setTimeout(finishLoading, 8000); // hard fallback in case 'ended' never fires
    </script>
